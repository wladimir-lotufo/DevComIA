<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="slide-container">
    <div class="slide-header">
      <div class="slide-badge">3. O Novo Processo de Trabalho</div>
      <h1 class="slide-title">Da Escrita para a Revisão</h1>
    </div>
    
    <div class="slide-content">
      <div class="glass-card center-content">
        <div class="card-icon">⚙️</div>
        <h2 class="card-title">Próximos Slides</h2>
        <p class="card-text">
          O conteúdo completo deste e dos demais slides será desenvolvido conforme a evolução da apresentação.
        </p>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') window.parent.postMessage('next', '*');
      if (e.key === 'ArrowLeft') window.parent.postMessage('prev', '*');
    });
  </script>
</body>
</html>
