<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- ==========================================
       Design System: MIRA SKETCH
       ========================================== -->
  
  <!-- 3. Sombreamento em Cores (Marcador Aquarela - Fica por baixo do traço) -->
  <!-- Note: Background omitido para obedecer a regra de fundo transparente do mira-draft -->
  <g stroke="#82e0d8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M45,105 Q100,115 155,105 M155,105 L130,75 M155,105 L130,135" stroke-width="15" />
  </g>

  <!-- 4. Contornos e Rabiscos (A Caneta Nanquim) -->
  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Camada de Traço Principal (Caneta Grossa) -->
    <g stroke-width="4.5">
      <path d="M40,100 Q100,110 160,100" />
      <path d="M160,100 Q145,85 130,70" />
      <path d="M160,100 Q145,115 130,130" />
    </g>
    
    <!-- Camada de Efeito Sketch (Caneta Fina e Irregular) -->
    <g stroke-width="2.0">
      <path d="M38,102 Q102,108 162,98" />
      <path d="M158,102 Q143,83 128,72" />
      <path d="M158,98 Q143,113 132,128" />
    </g>
    
  </g>
</svg>
