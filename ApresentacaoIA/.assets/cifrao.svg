<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- ==========================================
       Design System: MIRA SKETCH
       ========================================== -->
  
  <!-- 1. Fundo Base (Transparente) -->
  
  <!-- 2. Preenchimento do Corpo (Esconde a sobreposição traseira) -->
  <g fill="#ffffff">
    <path d="M 80 15 Q 85 100, 80 185 L 90 185 Q 95 100, 90 15 Z" />
    <path d="M 110 15 Q 115 100, 110 185 L 120 185 Q 125 100, 120 15 Z" />
