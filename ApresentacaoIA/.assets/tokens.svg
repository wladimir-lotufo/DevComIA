<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definições para as pecinhas (Tokens) -->
  <defs>
    <!-- Um bloquinho/token básico -->
    <g id="token">
      <rect x="-10" y="-10" width="20" height="20" rx="3" />
    </g>
    <!-- Funil Path -->
    <path id="funnel" d="M 40 40 Q 100 50 160 40 Q 150 70 120 100 L 120 180 Q 100 190 80 180 L 80 100 Q 50 70 40 40 Z" />
  </defs>

  <!-- Fundo (Transparente conforme regra da skill /draft) -->
  
  <!-- Preenchimento Base -->
  <g fill="#ffffff">
    <use href="#funnel" />
    <use href="#token" x="70" y="25" transform="rotate(-15 70 25)" />
    <use href="#token" x="130" y="30" transform="rotate(25 130 30)" />
    <use href="#token" x="100" y="70" transform="rotate(5 100 70)" />
    <use href="#token" x="95" y="115" transform="rotate(-10 95 115)" />
    <use href="#token" x="105" y="155" transform="rotate(15 105 155)" />
  </g>

  <!-- Sombras (Cyan) -->
  <g stroke="#82e0d8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" stroke-width="15">
    <path d="M 42 42 Q 102 52 162 42 Q 152 72 122 102 L 122 182 Q 102 192 82 182 L 82 102 Q 52 72 42 42 Z" />
    <!-- Shadows for tokens -->
    <rect x="62" y="17" width="20" height="20" rx="3" transform="rotate(-15 70 25)" stroke-width="10" />
    <rect x="122" y="22" width="20" height="20" rx="3" transform="rotate(25 130 30)" stroke-width="10" />
    <rect x="92" y="62" width="20" height="20" rx="3" transform="rotate(5 100 70)" stroke-width="10" />
    <rect x="87" y="107" width="20" height="20" rx="3" transform="rotate(-10 95 115)" stroke-width="10" />
    <rect x="97" y="147" width="20" height="20" rx="3" transform="rotate(15 105 155)" stroke-width="10" />
  </g>

  <!-- Contornos Negros -->
  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Linha de Limite do Pedágio (Tracejada Vermelha) -->
    <!-- Desenhada primeiro para ficar por baixo das pecinhas que estiverem na frente -->
    <path d="M 70 140 L 130 140" stroke="#e85d45" stroke-width="5" stroke-dasharray="8 6" />
    <text x="135" y="145" font-family="sans-serif" font-weight="bold" font-size="12" fill="#e85d45" stroke="none">MAX</text>

    <!-- Traço Principal (4.5) -->
    <g stroke-width="4.5">
      <use href="#funnel" />
      <path d="M 40 40 Q 100 30 160 40" /> <!-- Parte superior oval -->
      
      <!-- Tokens -->
      <use href="#token" x="70" y="25" transform="rotate(-15 70 25)" />
      <use href="#token" x="130" y="30" transform="rotate(25 130 30)" />
      <use href="#token" x="100" y="70" transform="rotate(5 100 70)" />
      <use href="#token" x="95" y="115" transform="rotate(-10 95 115)" />
      <use href="#token" x="105" y="155" transform="rotate(15 105 155)" />
    </g>
    
    <!-- Efeito Sketch (2.0) -->
    <g stroke-width="2.0">
      <path d="M 38 38 Q 98 48 158 38 Q 148 68 118 98 L 118 178 Q 98 188 78 178 L 78 98 Q 48 68 38 38 Z" />
      <path d="M 38 38 Q 98 28 158 38" />
      
      <!-- Detalhes no Funil -->
      <path d="M 115 105 L 115 170 M 85 105 L 85 170" />
      <path d="M 113 107 L 113 168 M 87 107 L 87 168" stroke-width="1.0" />
      
      <!-- Tokens Sketch Lines -->
      <rect x="58" y="13" width="20" height="20" rx="3" transform="rotate(-15 70 25)" />
      <rect x="118" y="18" width="20" height="20" rx="3" transform="rotate(25 130 30)" />
      <rect x="88" y="58" width="20" height="20" rx="3" transform="rotate(5 100 70)" />
      <rect x="83" y="103" width="20" height="20" rx="3" transform="rotate(-10 95 115)" />
      <rect x="93" y="143" width="20" height="20" rx="3" transform="rotate(15 105 155)" />
    </g>

    <!-- Letras nos Tokens (Preto) -->
    <g stroke="none" fill="#1a1a1a" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">
      <text x="70" y="30" transform="rotate(-15 70 25)">T</text>
      <text x="130" y="35" transform="rotate(25 130 30)">O</text>
      <text x="100" y="75" transform="rotate(5 100 70)">K</text>
      <text x="95" y="120" transform="rotate(-10 95 115)">E</text>
      <text x="105" y="160" transform="rotate(15 105 155)">N</text>
    </g>
  </g>
</svg>
