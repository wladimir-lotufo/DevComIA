<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- ==========================================
       Design System: MIRA SKETCH
       Image: Locked Clock (Relógio Bloqueado)
       ========================================== -->
  
  <!-- 1. Fundo Base (Proteção contra Dark Mode) -->
  <rect x="0" y="0" width="200" height="200" fill="#ffffff" />
  
  <!-- 2. Preenchimento do Corpo (Esconde a sobreposição traseira) -->
  <path d="M 46 90 L 152 92 L 150 182 L 48 180 Z" fill="#ffffff" />
  
  <!-- 3. Sombreamento em Cores (Marcador Aquarela - Fica por baixo do traço) -->
  <g stroke="#82e0d8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M 142 96 L 144 172 C 144 175 142 176 138 176 L 52 174" stroke-width="18" />
    <path d="M 138 98 L 140 168 C 140 170 138 172 135 172 L 58 170" stroke-width="8" opacity="0.5" />
  </g>

  <!-- 4. Contornos e Rabiscos (A Caneta Nanquim) -->
  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Camada de Traço Principal (Caneta Grossa) -->
    <g stroke-width="4.5">
      <!-- Shackle Outer -->
      <path d="M 64 92 C 63 60 68 18 100 18 C 132 18 137 60 136 92" />
      <!-- Shackle Inner -->
      <path d="M 78 92 C 77 65 80 32 100 32 C 120 32 123 65 122 92" />
      
      <!-- Padlock Body Main Outline -->
      <path d="M 46 90 L 152 92 L 150 182 L 48 180 Z" />
      
      <!-- Inner clock face -->
      <path d="M 100 96 C 115 94 124 106 122 120 C 120 136 110 144 100 143 C 80 142 76 133 78 120 C 80 106 85 98 100 96 Z" />
      
      <!-- Minute hand -->
      <path d="M 100 120 Q 95 107 90 97" />
      
      <!-- Hour hand -->
      <path d="M 100 120 Q 110 125 115 130" />
    </g>
    
    <!-- Camada de Efeito Sketch (Caneta Fina e Irregular) -->
    <g stroke-width="2.0">
      <!-- Shackle Outer Sketch -->
      <path d="M 67 92 C 66 60 70 15 100 15 C 130 15 134 60 133 92" />
      <!-- Shackle Inner Sketch -->
      <path d="M 81 92 C 80 65 82 30 100 30 C 118 30 120 65 119 92" />
      
      <!-- Padlock Body Sketch -->
      <path d="M 42 93 L 155 89" />
      <path d="M 147 94 L 153 180" />
      <path d="M 152 178 L 44 183" />
      <path d="M 50 184 L 45 92" />
      
      <!-- Inner clock face sketch -->
      <path d="M 98 94 C 118 92 128 104 126 120 C 124 138 112 148 98 147 C 78 146 72 135 74 120 C 76 104 82 96 98 94 Z" />
      
      <!-- Hands sketch -->
      <path d="M 100 120 Q 97 107 92 97" />
      <path d="M 100 120 Q 108 125 113 130" />
    </g>

    <!-- Detalhes Internos -->
    <g stroke-width="3.0">
      <!-- Shackle entry holes/lines -->
      <path d="M 60 91 L 84 93" />
      <path d="M 116 93 L 140 91" />
      
      <!-- Clock ticks -->
      <path d="M 100 100 L 101 106" />
      <path d="M 100 140 L 99 134" />
      <path d="M 81 120 L 87 119" />
      <path d="M 119 120 L 113 121" />

      <!-- Left ringing marks -->
      <path d="M 38 110 C 32 115 32 125 38 130" />
      <path d="M 30 105 C 22 115 22 125 30 135" />
      
      <!-- Right ringing marks -->
      <path d="M 160 110 C 166 115 166 125 160 130" />
      <path d="M 168 105 C 176 115 176 125 168 135" />
    </g>
    
  </g>

  <!-- 5. Elementos Finais (Olhos, Reflexos Brancos, Miolos Escuros) -->
  <g>
    <!-- Keyhole -->
    <path d="M 94 156 C 92 148 108 148 106 156 C 104 162 103 165 103 174 C 103 179 97 179 97 174 C 97 165 96 162 94 156 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />
    <!-- White inner reflection -->
    <path d="M 104 156 C 102 162 101 164 101 172" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
    
    <!-- Clock Center Pin -->
    <circle cx="100" cy="120" r="3" fill="#1a1a1a" />
    
    <!-- Minute hand arrowhead -->
    <path d="M 88 103 L 90 97 L 96 101 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Hour hand arrowhead -->
    <path d="M 109 128 L 115 130 L 113 124 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
