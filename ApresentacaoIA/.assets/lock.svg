<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Sketchy Padlock SVG -->
  
  <!-- Solid White Background to prevent invisible lines in Dark Mode -->
  <rect x="0" y="0" width="200" height="200" fill="#ffffff" />
  
  <!-- Padlock Body Base Fill -->
  <path d="M 46 90 L 152 92 L 150 182 L 48 180 Z" fill="#ffffff" />
  
  <!-- Cyan Shading inside the body -->
  <path d="M 142 96 L 144 172 C 144 175 142 176 138 176 L 52 174" stroke="#82e0d8" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M 138 98 L 140 168 C 140 170 138 172 135 172 L 58 170" stroke="#82e0d8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

  <!-- Outlines -->
  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Shackle Outer -->
    <path d="M 64 92 C 63 60 68 18 100 18 C 132 18 137 60 136 92" stroke-width="4.5" />
    <path d="M 67 92 C 66 60 70 15 100 15 C 130 15 134 60 133 92" stroke-width="2" />
    
    <!-- Shackle Inner -->
    <path d="M 78 92 C 77 65 80 32 100 32 C 120 32 123 65 122 92" stroke-width="4" />
    <path d="M 81 92 C 80 65 82 30 100 30 C 118 30 120 65 119 92" stroke-width="2" />
    
    <!-- Shackle entry holes/lines -->
    <path d="M 60 91 L 84 93" stroke-width="3" />
    <path d="M 116 93 L 140 91" stroke-width="3" />
    
    <!-- Padlock Body Main Outline -->
    <path d="M 46 90 L 152 92 L 150 182 L 48 180 Z" stroke-width="4.5" />
    
    <!-- Sketchy extra lines for body -->
    <path d="M 42 93 L 155 89" stroke-width="2" />
    <path d="M 147 94 L 153 180" stroke-width="2" />
    <path d="M 152 178 L 44 183" stroke-width="2" />
    <path d="M 50 184 L 45 92" stroke-width="2" />
    
  </g>

  <!-- Keyhole -->
  <g>
    <!-- Black hole -->
    <path d="M 90 120 C 88 110 112 110 110 120 C 108 128 105 132 105 145 C 105 152 95 152 95 145 C 95 132 92 128 90 120 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" />
    <!-- White inner reflection / 3D rim -->
    <path d="M 106 120 C 104 128 102 130 102 142" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
</svg>
