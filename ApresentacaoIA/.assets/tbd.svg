<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- ==========================================
       Design System: MIRA SKETCH
       ========================================== -->
  
  <!-- 1. Fundo Base -->
  <rect x="0" y="0" width="200" height="200" fill="#ffffff" />
  
  <!-- 2. Preenchimento do Corpo -->
  <path d="M 40 40 L 160 38 L 162 160 L 38 162 Z" fill="#ffffff" />
  
  <!-- 3. Sombreamento em Cores (Marcador Cyan) -->
  <g stroke="#82e0d8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M 85 85 Q 100 65 115 85 Q 120 100 100 115 L 100 130" stroke-width="18" />
    <path d="M 100 150 L 100 152" stroke-width="18" />
  </g>

  <!-- 4. Contornos e Rabiscos (A Caneta Nanquim) -->
  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Camada de Traço Principal (Caneta Grossa) -->
    <g stroke-width="4.5">
      <!-- Outer box: Dashed-like hand-drawn -->
      <path d="M 40 40 L 80 39" />
      <path d="M 100 38 L 160 39" />
      <path d="M 160 60 L 161 100" />
      <path d="M 162 120 L 161 160" />
      <path d="M 140 162 L 100 161" />
      <path d="M 80 161 L 40 162" />
      <path d="M 38 140 L 39 100" />
      <path d="M 39 80 L 40 40" />
      
      <!-- Question mark -->
      <path d="M 85 85 C 85 65, 115 65, 115 85 C 115 100, 100 105, 100 120" />
    </g>
    
    <!-- Camada de Efeito Sketch (Caneta Fina e Irregular) -->
    <g stroke-width="2.0">
      <!-- Outer box sketch -->
      <path d="M 38 41 L 82 38" />
      <path d="M 98 40 L 162 37" />
      <path d="M 158 62 L 163 102" />
      <path d="M 160 118 L 163 158" />
      <path d="M 142 160 L 98 163" />
      <path d="M 78 162 L 38 160" />
      <path d="M 40 138 L 37 98" />
      <path d="M 37 82 L 42 38" />
      
      <!-- Question mark sketch -->
      <path d="M 83 84 C 83 62, 117 62, 117 84 C 117 102, 98 107, 98 122" />
    </g>

    <!-- Ponto da interrogação -->
    <g stroke-width="4.5">
      <path d="M 100 145 L 100 146" />
    </g>
    <g stroke-width="2.0">
      <path d="M 102 144 L 102 147" />
    </g>
    
  </g>
</svg>
